include:
  - project: 'ci-cd/semantic-release'
    ref: main
    file: 'semantic-release.yml'

  - project: 'ci-cd/magento-module'
    ref: master
    file: 'codeception-ci.yml'

  - project: 'ci-cd/magento-module'
    ref: master
    file: 'codequality-ci.yml'

  - project: 'ci-cd/tweakwise'
    ref: main
    file: 'github-release.yml'

  - project: 'ci-cd/tweakwise'
    ref: main
    file: 'demo-pipeline-trigger.yml'
variables:
  MAGENTO_PHP_VERSION: '8.2'

magento-module/test/functional:
  variables:
    MIN_PHP_VERSION: '8.2'
    DISABLE_DEPENDENCY_AUDIT: "true"
    CODECEPTION_ARGS: '-vvv'
  after_script:
    - |
      echo "after_script: CI_JOB_STATUS=$CI_JOB_STATUS"
      pwd
      if [ "$CI_JOB_STATUS" != "failed" ]; then
        echo "after_script: skip verbose rerun (job not failed)"
        exit 0
      fi
      CODECEPT_PATH=""
      if [ -f ./vendor/bin/codecept ]; then
        CODECEPT_PATH="./vendor/bin/codecept"
      elif [ -f /var/www/html/vendor/bin/codecept ]; then
        CODECEPT_PATH="/var/www/html/vendor/bin/codecept"
      fi
      if [ -z "$CODECEPT_PATH" ]; then
        echo "after_script: codecept binary not found in ./vendor/bin or /var/www/html/vendor/bin"
        ls -la ./vendor/bin || true
        ls -la /var/www/html/vendor/bin || true
        echo "after_script: listing /var/www/html/tests/_output"
        ls -la /var/www/html/tests/_output || true
        echo "after_script: dumping first 200 lines of output files"
        for f in /var/www/html/tests/_output/*; do
          if [ -f "$f" ]; then
            echo "===== $f (first 200 lines) ====="
            sed -n '1,200p' "$f" || true
          fi
        done
        exit 0
      fi
      if [ "$CODECEPT_PATH" = "/var/www/html/vendor/bin/codecept" ]; then
        cd /var/www/html
      fi
      echo "after_script: listing /var/www/html/tests/_output"
      ls -la /var/www/html/tests/_output || true
      echo "after_script: dumping first 200 lines of output files"
      for f in /var/www/html/tests/_output/*; do
        if [ -f "$f" ]; then
          echo "===== $f (first 200 lines) ====="
          sed -n '1,200p' "$f" || true
        fi
      done

release:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
